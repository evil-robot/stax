name: font-probe
on: { workflow_dispatch: {} }
jobs:
  probe:
    strategy:
      matrix:
        fonts: [none, system]
    runs-on: ubuntu-latest
    container: node:22-bookworm-slim
    steps:
      - uses: actions/checkout@v4
      - name: System fonts (matrix)
        if: matrix.fonts == 'system'
        run: apt-get update -qq && apt-get install -y -qq fontconfig fonts-dejavu-core > /dev/null && fc-list | wc -l
      - name: Install
        run: npm ci
      - name: Render probes
        run: |
          cat > probe.js <<'JS'
          const { createCanvas, registerFont } = require("canvas");
          const fs = require("fs");
          const c = createCanvas(900, 420); const ctx = c.getContext("2d");
          ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, 900, 420); ctx.fillStyle = "#000";
          const line = (n, font, label) => { ctx.font = font; ctx.fillText(`${n}. ${label}: Carver MN 2.39 CATEGORIES`, 12, 40 * n); };
          registerFont("fonts/Inter-Bold.ttf", { family: "B1" });
          line(1, "28px B1", "bold ttf as plain family, no weight asked");
          registerFont("fonts/Inter-Bold.ttf", { family: "B2", weight: "bold" });
          line(2, "bold 28px B2", "bold ttf declared bold, asked bold");
          registerFont("fonts/Inter-Regular.ttf", { family: "R" });
          line(3, "700 28px R", "regular ttf, asked 700 (synthetic)");
          line(4, "28px R", "regular ttf, asked normal");
          registerFont("fonts/Inter-Regular.ttf", { family: "F", weight: "400" });
          registerFont("fonts/Inter-Bold.ttf", { family: "F", weight: "700" });
          line(5, "400 28px F", "family F 400");
          line(6, "700 28px F", "family F 700");
          registerFont("fonts/Inter-SemiBold.ttf", { family: "S" });
          line(7, "28px S", "semibold ttf plain family");
          registerFont("fonts/Inter-Bold.ttf", { family: "B3", weight: "700", style: "normal" });
          line(8, "600 28px B3", "bold ttf declared 700, asked 600");
          line(9, "bold 28px 'Inter Bold'", "by internal name Inter Bold (unregistered alias)");
          line(10, "700 28px sans-serif", "system sans-serif 700");
          fs.writeFileSync("probe-matrix.png", c.toBuffer("image/png"));
          JS
          node probe.js
      - uses: actions/upload-artifact@v4
        with: { name: "probes-${{ matrix.fonts }}", path: "probe-matrix.png" }
